# DavMail settings for this phone. Only the CalDAV listener runs. The app always sets
# server mode, binds to 127.0.0.1 (unless davmail.allowRemote=true), disables update checks and
# keeps the log in app storage. Credentials come from the CalDAV client (DAVx⁵), not this file.
davmail.mode=EWS
davmail.url=https://mail.example.org/EWS/Exchange.asmx
davmail.caldavPort=11080
# EWS folders shared with you whose parents you cannot see (e-kotov/davmail patch):
# davmail.folderAliases=name=EwsFolderId;name2=EwsFolderId2
# WARN keeps event contents out of the log.
log4j.rootLogger=WARN
log4j.logger.davmail=WARN
log4j.logger.httpclient.wire=WARN
log4j.logger.httpclient=WARN
