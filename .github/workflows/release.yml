name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.DAVMAIL_ANDROID_KEYSTORE_B64 }}
          DAVMAIL_ANDROID_STORE_PASSWORD: ${{ secrets.DAVMAIL_ANDROID_STORE_PASSWORD }}
          DAVMAIL_ANDROID_KEY_PASSWORD: ${{ secrets.DAVMAIL_ANDROID_STORE_PASSWORD }}
          DAVMAIL_ANDROID_KEY_ALIAS: davmail-android
        run: |
          set -euo pipefail
          version="${TAG#v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$((major * 10000 + minor * 100 + patch))
          export DAVMAIL_ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$DAVMAIL_ANDROID_KEYSTORE"
          ./gradlew --no-daemon assembleRelease -PappVersion="$version" -PappVersionCode="$code"
          out="DavMail-Android-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$out"
          sha256sum "$out" > SHA256SUMS
          rm -f "$DAVMAIL_ANDROID_KEYSTORE"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          davmail=$(grep '^version=' gradle/davmail.properties | cut -d= -f2)
          notes="DavMail for Android $version, embedding DavMail $davmail from https://github.com/e-kotov/davmail."
          gh release create "$TAG" "DavMail-Android-$version.apk" SHA256SUMS --verify-tag --title "DavMail for Android $version" --notes "$notes"
